# app_config.yaml
# 管道腐蚀AI系统配置文件

# === LLM API 配置 ===
# 方式一：通义千问（推荐，国内可用）
# 获取 API Key: https://dashscope.console.aliyun.com/
dashscope_api_key: ""

# 方式二：OpenAI API
openai_api_key: ""

# 方式三：智谱GLM API
# 获取 API Key: https://open.bigmodel.cn/
zhipu_api_key: ""

# === Dify Cloud API 配置（推荐用于知识问答） ===
# 1. 注册 dify.ai 账号
# 2. 创建知识库应用，上传标准文档
# 3. 在「访问 API」页面获取以下信息
dify_api_url: "https://api.dify.ai/v1"
dify_api_key: ""

# === 模型配置 ===
model:
  # 预测模型文件路径
  predictor_path: "models/corrosion_predictor.pkl"
  # 训练数据量
  n_samples: 500
  # 随机种子
  random_state: 42

# === RAG 配置 ===
rag:
  # 文档分段大小
  chunk_size: 500
  # 分段重叠
  chunk_overlap: 50
  # 检索返回数量
  top_k: 3
  # 嵌入模型
  embedding_model: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"

# === Gradio 配置 ===
gradio:
  server_name: "0.0.0.0"
  server_port: 7860
